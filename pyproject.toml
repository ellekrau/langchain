[project]
name = "langchain-project"
version = "0.1.0"
description = "AI study project for LangChain"
readme = "README.md"
authors = [
    { name = "Adrielle", email = "ellekrau91@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "arize-phoenix-otel>=0.17.1",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-core",
    "langchain-deepseek>=1.1.1",
    "langchain-openrouter>=0.2.9",
    "openinference-instrumentation-langchain>=0.1.78",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
